<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Novolis Hours</title>
  <base href="/">
  <link href="_content/Novolis.Blazor.GraphicalProfile/css/graphical-profile.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div id="app">Loading Novolis Hours…</div>
  <div id="blazor-error-ui">
    The browser client encountered an error.
    <a href="" class="reload">Reload</a>
    <a class="dismiss">×</a>
  </div>
  <script>
    window.hoursStripRatio = (element, clientX) => {
      if (!element) return 0;
      const box = element.getBoundingClientRect();
      return box.width <= 0 ? 0 : (clientX - box.left) / box.width;
    };
  </script>
  <script src="_framework/blazor.webassembly.js"></script>
</body>
</html>
