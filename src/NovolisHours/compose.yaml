services:
  novolis-hours:
    build:
      context: ../..
      dockerfile: src/NovolisHours/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Hours__DataPath: /data
      Hours__EnableDemoAdminCredentials: "false"
      Hours__InitialAdministratorPassword: ${HOURS_INITIAL_ADMINISTRATOR_PASSWORD:?Set a non-demo bootstrap secret before starting Novolis Hours.}
    volumes:
      - novolis-hours-data:/data

volumes:
  novolis-hours-data:
