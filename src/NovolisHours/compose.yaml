services:
  novolis-hours:
    build:
      context: ../..
      dockerfile: src/NovolisHours/Dockerfile
    ports:
      - "8080:8080"
    environment:
      Hours__DataPath: /data
      Hours__EnableDemoAdminCredentials: "false"
    volumes:
      - novolis-hours-data:/data

volumes:
  novolis-hours-data:
