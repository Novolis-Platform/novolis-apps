name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: apps-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/apps-ci.yml@main
    secrets: inherit
    with:
      mode: ${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'merge' }}
    permissions:
      contents: read
      packages: read
