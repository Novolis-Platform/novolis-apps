name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      skip_release:
        description: Skip release job (CI only)
        type: boolean
        default: false

# Supersede rapid re-pushes; Linux CI must pass before any Windows minute is spent.
concurrency:
  group: apps-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.gate.outputs.run_ci }}
      run_release: ${{ steps.gate.outputs.run_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            release:
              - 'src/**'
              - 'scripts/**'
              - 'Novolis.Apps.slnx'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'global.json'
              - 'build/**'
            ci:
              - 'src/**'
              - 'tests/**'
              - 'scripts/**'
              - 'Novolis.Apps.slnx'
              - 'Directory.Build.props'
              - 'Directory.Build.targets'
              - 'Directory.Packages.props'
              - 'nuget.config'
              - 'global.json'
              - 'build/**'
              - '.github/workflows/**'

      - id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKIP_RELEASE: ${{ inputs.skip_release }}
          FILTER_RELEASE: ${{ steps.filter.outputs.release }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            if [ "$SKIP_RELEASE" = 'true' ]; then
              echo "run_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "run_release=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          run_ci=false
          run_release=false
          if [ "${FILTER_CI:-}" = 'true' ] || [ "${FILTER_RELEASE:-}" = 'true' ]; then
            run_ci=true
          fi
          if [ "${FILTER_RELEASE:-}" = 'true' ]; then
            run_release=true
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "detect: run_ci=$run_ci run_release=$run_release"

  ci:
    needs: detect
    if: needs.detect.outputs.run_ci == 'true'
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-pull-request.yml@main
    secrets: inherit
    with:
      solution: Novolis.Apps.slnx
      run_tests: false
    permissions:
      contents: read
      packages: read

  release:
    needs: [detect, ci]
    if: |
      always()
      && needs.ci.result == 'success'
      && needs.detect.outputs.run_release == 'true'
      && (github.event_name != 'workflow_dispatch' || inputs.skip_release != true)
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout governance build targets
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Version.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${{ github.repository_owner }}/novolis-governance.git" "$gov"
          fi

      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x

      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey failed to install Inno Setup." }

      - name: Publish all apps and build installers
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package-version }}
          ASSEMBLY_VERSION: ${{ steps.ver.outputs.assembly-version }}
          FILE_VERSION: ${{ steps.ver.outputs.file-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Publish-NovolisApp.ps1

          $published = [System.Collections.Generic.List[object]]::new()
          foreach ($app in (Get-NovolisAppCatalog)) {
            $item = Publish-NovolisApp `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -AppKey $app.Key `
              -ProjectRelativePath $app.Project `
              -PackageVersion $env:PACKAGE_VERSION `
              -AssemblyVersion $env:ASSEMBLY_VERSION `
              -FileVersion $env:FILE_VERSION |
              Where-Object { $_.ZipPath } |
              Select-Object -Last 1
            if (-not $item -or -not $item.ZipPath) {
              throw "Publish-NovolisApp did not return a ZipPath for $($app.Key)."
            }
            $published.Add($item)
          }

          $lines = @()
          $assets = [System.Collections.Generic.List[string]]::new()
          foreach ($item in $published) {
            $assets.Add($item.ZipPath)
            $hashZip = (Get-FileHash -LiteralPath $item.ZipPath -Algorithm SHA256).Hash
            $lines += "$hashZip  $($item.ZipName)"
            if ($item.InstallerPath) {
              $assets.Add($item.InstallerPath)
              $hashExe = (Get-FileHash -LiteralPath $item.InstallerPath -Algorithm SHA256).Hash
              $lines += "$hashExe  $($item.InstallerName)"
            }
          }

          $sumsPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/SHA256SUMS.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $sumsPath) | Out-Null
          $lines | Set-Content -Path $sumsPath -Encoding utf8NoBOM
          $assets.Add($sumsPath)

          $tag = "v$env:PACKAGE_VERSION"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Novolis Apps $env:PACKAGE_VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
          }
          gh release upload $tag @($assets.ToArray()) --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with exit code $LASTEXITCODE." }

      - name: Prune older GitHub Releases (keep last 5)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File ./scripts/prune-github-releases.ps1 -Keep 5
