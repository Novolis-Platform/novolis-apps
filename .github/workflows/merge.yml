name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

# Supersede rapid re-pushes. Windows packaging is intentionally release-only.
concurrency:
  group: apps-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/dotnet-pull-request.yml@main
    secrets: inherit
    with:
      solution: Novolis.Apps.slnx
      run_tests: false
    permissions:
      contents: read
      packages: read
