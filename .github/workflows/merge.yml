name: Merge
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
  workflow_dispatch:

concurrency:
  group: apps-merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      skip_build: ${{ steps.matrix.outputs.skip_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - name: Resolve changed-app matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- \
              ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --all > /tmp/matrix.json
            else
              git diff --name-only "$before...${{ github.sha }}" > /tmp/changed-files.txt || true
              dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- \
                ci-matrix --repo "$GITHUB_WORKSPACE" --changed-files /tmp/changed-files.txt \
                > /tmp/matrix.json
            fi
          fi
          echo "matrix=$(jq -c '.include' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "skip_build=$(jq -r '.skip_build' /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/matrix.json

  build:
    needs: detect
    if: needs.detect.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    concurrency:
      group: apps-merge-build-${{ matrix.key }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Checkout governance
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Version.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${{ github.repository_owner }}/novolis-governance.git" "$gov"
          fi
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}
      - name: Restore and build app solution
        if: matrix.linux_ci == true || matrix.linux_ci == 'True'
        run: |
          set -euo pipefail
          cfg=()
          if [ -f nuget.config ]; then cfg=(--configfile nuget.config); fi
          dotnet restore "${{ matrix.solution }}" "${cfg[@]}"
          dotnet build "${{ matrix.solution }}" --no-restore -c Release "${cfg[@]}"
      - name: Test scoped projects
        if: (matrix.run_tests == true || matrix.run_tests == 'True') && matrix.test_projects != ''
        run: |
          set -euo pipefail
          IFS=';' read -ra projects <<< "${{ matrix.test_projects }}"
          for proj in "${projects[@]}"; do
            [ -n "$proj" ] || continue
            echo "Testing $proj"
            dotnet test "$proj" --no-build -c Release
          done

  android:
    needs: detect
    if: needs.detect.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    concurrency:
      group: apps-merge-android-${{ matrix.key }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Skip when Android not required
        if: matrix.android_compile != true && matrix.android_compile != 'True'
        run: echo "No Android compile for ${{ matrix.key }}"
      - uses: actions/checkout@v4
        if: matrix.android_compile == true || matrix.android_compile == 'True'
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        if: matrix.android_compile == true || matrix.android_compile == 'True'
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        if: matrix.android_compile == true || matrix.android_compile == 'True'
        with:
          token: ${{ github.token }}
      - name: Install Android workload
        if: matrix.android_compile == true || matrix.android_compile == 'True'
        run: |
          if [ "${{ matrix.is_maui }}" = "True" ] || [ "${{ matrix.is_maui }}" = "true" ]; then
            dotnet workload install maui-android
          else
            dotnet workload install android
          fi
      - name: Compile Android / MAUI Android
        if: matrix.android_compile == true || matrix.android_compile == 'True'
        run: |
          set -euo pipefail
          project="${{ matrix.android_project }}"
          if [ "${{ matrix.is_maui }}" = "True" ] || [ "${{ matrix.is_maui }}" = "true" ]; then
            dotnet build "$project" -f net10.0-android -c Release \
              -p:NovolisMauiTargetFrameworks=net10.0-android
          else
            dotnet build "$project" -c Release
          fi
