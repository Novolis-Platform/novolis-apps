name: Release
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release (All expands each app's declared ship channels)
        type: choice
        default: DraftStudio
        options:
          - All
          - BooksWriterStudio
          - DraftStudio
          - CadStudio3D
          - SketchStudio
          - SinsOfACapitalismTycoon
          - LiveStudio
          - BooksMobile
          - ReadAloud
          - CoverageStudio
          - CapitalistSimulator
          - GeoPolity
          - RepoStudio
          - ShipDesigner
          - SpaceFleetSurveyTeam
          - Merglyph
      channel:
        description: Channel override; All uses every channel declared for the selected app.
        type: choice
        default: All
        options:
          - All
          - windows-inno
          - android-apk

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      windows_matrix: ${{ steps.matrix.outputs.windows_matrix }}
      android_matrix: ${{ steps.matrix.outputs.android_matrix }}
      package_version: ${{ steps.ver.outputs.package-version }}
      assembly_version: ${{ steps.ver.outputs.assembly-version }}
      file_version: ${{ steps.ver.outputs.file-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver
      - name: Build release matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          args=(release-matrix --repo "$GITHUB_WORKSPACE" --app "${{ inputs.app }}")
          if [ "${{ inputs.channel }}" != "All" ]; then
            args+=(--channel "${{ inputs.channel }}")
          fi
          dotnet run --project tools/AppsManifest/AppsManifest.csproj --no-launch-profile -- \
            "${args[@]}" > /tmp/release-matrix.json
          matrix=$(jq -c '.include' /tmp/release-matrix.json)
          windows_matrix=$(jq -c '[.include[] | select(.channel == "windows-inno")]' /tmp/release-matrix.json)
          android_matrix=$(jq -c '[.include[] | select(.channel == "android-apk")]' /tmp/release-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "windows_matrix=$windows_matrix" >> "$GITHUB_OUTPUT"
          echo "android_matrix=$android_matrix" >> "$GITHUB_OUTPUT"
          cat /tmp/release-matrix.json

  windows-inno:
    needs: plan
    if: needs.plan.outputs.windows_matrix != '[]'
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.windows_matrix) }}
    steps:
      - name: Skip non-windows channel
        if: matrix.channel != 'windows-inno'
        shell: pwsh
        run: Write-Host "Skipping ${{ matrix.key }} channel ${{ matrix.channel }}"
      - uses: actions/checkout@v4
        if: matrix.channel == 'windows-inno'
      - name: Checkout governance build targets
        if: matrix.channel == 'windows-inno'
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Version.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${{ github.repository_owner }}/novolis-governance.git" "$gov"
          fi
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        if: matrix.channel == 'windows-inno'
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        if: matrix.channel == 'windows-inno'
        with:
          token: ${{ github.token }}
      - uses: Novolis-Platform/novolis-workflows/actions/install-inno-setup@main
        if: matrix.channel == 'windows-inno'
      - name: Publish windows-inno
        if: matrix.channel == 'windows-inno'
        id: publish
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          ASSEMBLY_VERSION: ${{ needs.plan.outputs.assembly_version }}
          FILE_VERSION: ${{ needs.plan.outputs.file_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Publish-NovolisApp.ps1
          $item = Publish-NovolisApp `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -AppKey '${{ matrix.key }}' `
            -ProjectRelativePath '${{ matrix.publish_windows }}' `
            -PackageVersion $env:PACKAGE_VERSION `
            -AssemblyVersion $env:ASSEMBLY_VERSION `
            -FileVersion $env:FILE_VERSION |
            Where-Object { $_.ZipPath } |
            Select-Object -Last 1
          if (-not $item) { throw "Publish failed for ${{ matrix.key }}" }
          $paths = @($item.ZipPath)
          if ($item.InstallerPath) { $paths += $item.InstallerPath }
          "assets<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $paths | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: matrix.channel == 'windows-inno'
        with:
          name: windows-${{ matrix.key }}
          path: |
            artifacts/${{ matrix.key }}/**/*.zip
            artifacts/${{ matrix.key }}/**/*.exe
          if-no-files-found: error

  android-apk:
    needs: plan
    if: needs.plan.outputs.android_matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.android_matrix) }}
    steps:
      - name: Skip non-android channel
        if: matrix.channel != 'android-apk'
        run: echo "Skipping ${{ matrix.key }} channel ${{ matrix.channel }}"
      - uses: actions/checkout@v4
        if: matrix.channel == 'android-apk'
      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        if: matrix.channel == 'android-apk'
        with:
          dotnet-version: 10.0.x
      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        if: matrix.channel == 'android-apk'
        with:
          token: ${{ github.token }}
      - name: Install Android workload
        if: matrix.channel == 'android-apk'
        run: |
          if [ "${{ matrix.stack }}" = "maui" ]; then
            dotnet workload install maui-android
          else
            dotnet workload install android
          fi
      - name: Publish signed APK
        if: matrix.channel == 'android-apk'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.package_version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Publish-NovolisApp.ps1
          $keyStore = Join-Path $env:RUNNER_TEMP 'novolis-android.keystore'
          $hasKey = $env:ANDROID_KEYSTORE_BASE64 -and $env:ANDROID_KEY_ALIAS -and $env:ANDROID_KEYSTORE_PASSWORD -and $env:ANDROID_KEY_PASSWORD
          if (-not $hasKey) {
            throw "Persistent Android signing secrets are required for android-apk releases of ${{ matrix.key }}."
          }
          [IO.File]::WriteAllBytes($keyStore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          $item = Publish-NovolisAndroidApk `
            -RepoRoot $env:GITHUB_WORKSPACE `
            -AppKey '${{ matrix.key }}' `
            -PackageVersion $env:PACKAGE_VERSION `
            -RunNumber ([int]$env:RUN_NUMBER) `
            -KeystorePath $keyStore `
            -KeyAlias $env:ANDROID_KEY_ALIAS `
            -KeystorePassword $env:ANDROID_KEYSTORE_PASSWORD `
            -KeyPassword $env:ANDROID_KEY_PASSWORD
          if (-not $item) { throw "APK publish failed for ${{ matrix.key }}" }
      - uses: actions/upload-artifact@v4
        if: matrix.channel == 'android-apk'
        with:
          name: android-${{ matrix.key }}
          path: artifacts/${{ matrix.key }}/android/*.apk
          if-no-files-found: error

  publish-release:
    needs: [plan, windows-inno, android-apk]
    if: always() && (needs.windows-inno.result == 'success' || needs.windows-inno.result == 'skipped') && (needs.android-apk.result == 'success' || needs.android-apk.result == 'skipped') && (needs.windows-inno.result == 'success' || needs.android-apk.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/download
      - name: Assemble checksums and release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          find artifacts/download -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.apk' \) -print0 |
            while IFS= read -r -d '' f; do
              cp "$f" artifacts/release/
            done
          (
            cd artifacts/release
            sha256sum * > SHA256SUMS.txt
          )
          echo "tag=v${{ needs.plan.outputs.package_version }}" >> "$GITHUB_OUTPUT"
          ls -la artifacts/release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.assets.outputs.tag }}"
          gh release create "$tag" artifacts/release/* \
            --title "$tag" \
            --notes "Selected-app release from build/apps.json (channels declared per app). No Linux artifacts in phase one." \
            --latest
      - name: Prune older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: pwsh -NoProfile -File ./scripts/prune-github-releases.ps1 -Repo "${{ github.repository }}" -Keep 5
