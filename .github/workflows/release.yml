name: Release
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to republish
        type: choice
        options:
          - All
          - BooksWriterStudio
          - DraftStudio
          - CadStudio3D
          - SketchStudio
          - SinsOfACapitalismTycoon
          - LiveStudio
          - BooksMobile
        default: All

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout governance build targets
        shell: bash
        run: |
          set -euo pipefail
          gov="../novolis-governance"
          if [ ! -f "$gov/build/Novolis.Version.targets" ]; then
            git clone --depth 1 --branch main \
              "https://github.com/${{ github.repository_owner }}/novolis-governance.git" "$gov"
          fi

      - uses: Novolis-Platform/novolis-workflows/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0.x

      - uses: Novolis-Platform/novolis-workflows/actions/authenticate-github-packages@main
        with:
          token: ${{ github.token }}

      - uses: Novolis-Platform/novolis-workflows/actions/read-version@main
        id: ver

      - uses: Novolis-Platform/novolis-workflows/actions/install-inno-setup@main
        id: inno

      - name: Publish selected apps
        id: publish
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.ver.outputs.package-version }}
          ASSEMBLY_VERSION: ${{ steps.ver.outputs.assembly-version }}
          FILE_VERSION: ${{ steps.ver.outputs.file-version }}
          SELECTED_APP: ${{ inputs.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/Publish-NovolisApp.ps1

          $catalog = Get-NovolisAppCatalog
          $selected = if ($env:SELECTED_APP -eq 'All') {
            $catalog
          } else {
            @($catalog | Where-Object { $_.Choice -eq $env:SELECTED_APP })
          }
          if ($selected.Count -eq 0) {
            throw "Unknown app selection: $($env:SELECTED_APP)"
          }

          $paths = [System.Collections.Generic.List[string]]::new()
          foreach ($app in $selected) {
            $item = Publish-NovolisApp `
              -RepoRoot $env:GITHUB_WORKSPACE `
              -AppKey $app.Key `
              -ProjectRelativePath $app.Project `
              -PackageVersion $env:PACKAGE_VERSION `
              -AssemblyVersion $env:ASSEMBLY_VERSION `
              -FileVersion $env:FILE_VERSION |
              Where-Object { $_.ZipPath } |
              Select-Object -Last 1
            if (-not $item -or -not $item.ZipPath) {
              throw "Publish-NovolisApp did not return a ZipPath for $($app.Key)."
            }
            $paths.Add($item.ZipPath)
            if ($item.InstallerPath) {
              $paths.Add($item.InstallerPath)
            }
          }

          @(
            'assets<<EOF'
          ) + @($paths) + @(
            'EOF'
          ) | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8NoBOM

      - uses: Novolis-Platform/novolis-workflows/actions/write-sha256sums@main
        id: sums
        with:
          files: ${{ steps.publish.outputs.assets }}
          output-path: artifacts/SHA256SUMS.txt

      - uses: Novolis-Platform/novolis-workflows/actions/ensure-github-release@main
        with:
          tag: v${{ steps.ver.outputs.package-version }}
          title: Novolis Apps ${{ steps.ver.outputs.package-version }}
          assets: |
            ${{ steps.publish.outputs.assets }}
            ${{ steps.sums.outputs.path }}
