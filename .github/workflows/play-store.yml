name: Google Play Delivery
on:
  workflow_dispatch:
    inputs:
      app:
        description: Google Play-enabled app from build/apps.json
        type: choice
        required: true
        default: ReadAloud
        options:
          - ReadAloud
          - All
      release_tag:
        description: Existing GitHub Release tag to deliver, for example v2026.1.0.45
        type: string
        required: true
      track:
        description: Google Play track
        type: choice
        required: true
        default: internal
        options:
          - internal
          - closed
          - open
          - production
      user_fraction:
        description: Production rollout fraction from 0.01 to 1.0
        type: string
        required: true
        default: '1'

jobs:
  play:
    uses: Novolis-Platform/novolis-workflows/.github/workflows/apps-play.yml@main
    secrets: inherit
    with:
      app: ${{ inputs.app }}
      release_tag: ${{ inputs.release_tag }}
      track: ${{ inputs.track }}
      user_fraction: ${{ inputs.user_fraction }}
    permissions:
      contents: read
      packages: read
